<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REI Vision</title>
<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fa;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100%;
background:#1f2937;
color:white;
padding-top:20px;
}

.sidebar h2{
text-align:center;
}

.sidebar a{
display:block;
padding:15px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:#374151;
}

.main{
margin-left:250px;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.number{
font-size:28px;
font-weight:bold;
color:#2563eb;
}

</style>

</head>
<script src="js/dashboard.js"></script>
<body>

<div class="sidebar">

<h2>🏢 REI Vision</h2>

<a href="#">Dashboard</a>
<a href="#">Portfolio</a>
<a href="#">Properties</a>
<a href="#">Tenants</a>
<a href="#">Leases</a>
<a href="#">Financials</a>
<a href="#">Market Analysis</a>
<a href="#">ZIP Rankings</a>

</div>

<div class="main">

<h1>Real Estate Investment Intelligence Platform</h1>

<div class="cards">

<div class="card">

</div>

</div>

</div>

<div class="card">

</div>

<div class="card">

</div>

</div>

</div>

</body>
</html>
